[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raft"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.7",
    "mypy==2.3.1",
    "hypothesis==6.168.0",
    "grpcio-tools==1.85.1",
    "types-grpcio==1.85.0.20261028",
    "types-protobuf==7.35.1.20260906",
]
# Running RaftNode as real processes (raft.net). Kept out of the core
# dependencies so the simulator and fuzzer need nothing installed.
# protobuf must be >= the version src/raft/net/raft_pb2.py was generated
# against; the generated module checks this at import time.
net = [
    "grpcio==1.85.1",
    "protobuf==7.36.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
raft = ["py.typed"]

[tool.pytest.ini_options]
markers = [
    "slow: large-sweep fuzz tests, deselected by default (run with -m slow)",
]
addopts = "-m 'not slow'"

[tool.coverage.run]
# Generated by scripts/gen_proto.sh from proto/raft.proto.
omit = ["*/raft/net/raft_pb2.py", "*/raft/net/raft_pb2_grpc.py"]
