[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raft"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.7",
    "mypy==2.3.1",
    "hypothesis==6.168.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
raft = ["py.typed"]

[tool.pytest.ini_options]
markers = [
    "slow: large-sweep fuzz tests, deselected by default (run with -m slow)",
]
addopts = "-m 'not slow'"
